<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Math Bubbles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }
        #info {
            font-size: 18px;
            margin: 10px;
        }
        #timer {
            font-size: 16px;
            color: red;
            font-weight: bold;
        }
        #canvas {
            border: 1px solid #ccc;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Accenture 2026 Mock: Fast Math Bubbles</h1>
    <div id="info">Click Bubbles in ASCENDING Order (Low -> High)</div>
    <div id="timer">Time: 15</div>
    <canvas id="canvas" width="600" height="300"></canvas>

    <script>
        class FastMathGame {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.infoDiv = document.getElementById('info');
                this.timerDiv = document.getElementById('timer');
                this.score = 0;
                this.round = 1;
                this.timeLimit = 15;
                this.startTime = Date.now();
                this.bubbles = [];
                this.correctOrder = [];
                this.timerInterval = null;
                this.canvas.addEventListener('click', this.handleClick.bind(this));
                this.startRound();
                this.updateTimer();
            }

            generateProblem() {
                const ops = ['+', '-', '*'];
                const op = ops[Math.floor(Math.random() * ops.length)];
                let a = Math.floor(Math.random() * 12) + 1;
                let b = Math.floor(Math.random() * 10) + 1;
                
                if (op === '*') {
                    a = Math.floor(Math.random() * 5) + 1;
                    b = Math.floor(Math.random() * 5) + 1;
                }
                
                const expr = `${a} ${op} ${b}`;
                const val = eval(expr);
                return { expr, val };
            }

            startRound() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.bubbles = [];
                this.startTime = Date.now();
                
                const numBubbles = Math.floor(Math.random() * 3) + 3; // 3 to 5
                const data = [];
                
                for (let i = 0; i < numBubbles; i++) {
                    let problem = this.generateProblem();
                    while (data.some(d => d.val === problem.val)) {
                        problem = this.generateProblem();
                    }
                    data.push(problem);
                }
                
                this.correctOrder = data.sort((a, b) => a.val - b.val);
                
                for (let i = 0; i < data.length; i++) {
                    const x = Math.floor(Math.random() * 500) + 50;
                    const y = Math.floor(Math.random() * 200) + 50;
                    
                    this.bubbles.push({
                        x: x,
                        y: y,
                        val: data[i].val,
                        expr: data[i].expr
                    });
                }
                
                this.drawBubbles();
            }

            drawBubbles() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (const bubble of this.bubbles) {
                    this.ctx.beginPath();
                    this.ctx.arc(bubble.x, bubble.y, 40, 0, 2 * Math.PI);
                    this.ctx.fillStyle = 'lightblue';
                    this.ctx.fill();
                    this.ctx.strokeStyle = 'blue';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                    
                    this.ctx.fillStyle = 'black';
                    this.ctx.font = 'bold 12px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(bubble.expr, bubble.x, bubble.y + 4);
                }
            }

            handleClick(event) {
                const rect = this.canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                
                for (let i = 0; i < this.bubbles.length; i++) {
                    const bubble = this.bubbles[i];
                    const dist = Math.sqrt((x - bubble.x) ** 2 + (y - bubble.y) ** 2);
                    if (dist <= 40) {
                        this.checkAnswer(bubble.val, i);
                        break;
                    }
                }
            }

            checkAnswer(value, index) {
                const expectedVal = this.correctOrder[0].val;
                
                if (value === expectedVal) {
                    this.bubbles.splice(index, 1);
                    this.correctOrder.shift();
                    
                    if (this.correctOrder.length === 0) {
                        this.score++;
                        this.round++;
                        this.infoDiv.textContent = \`Round \${this.round} | Score: \${this.score}\`;
                        this.startRound();
                    } else {
                        this.drawBubbles();
                    }
                } else {
                    this.gameOver("Wrong Order!");
                }
            }

            updateTimer() {
                const elapsed = (Date.now() - this.startTime) / 1000;
                const remaining = Math.max(0, Math.floor(this.timeLimit - elapsed));
                this.timerDiv.textContent = \`Time: \${remaining}s\`;
                
                if (remaining <= 0) {
                    this.gameOver("Time's Up!");
                } else {
                    this.timerInterval = setTimeout(this.updateTimer.bind(this), 100);
                }
            }

            gameOver(reason) {
                clearTimeout(this.timerInterval);
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.fillStyle = 'red';
                this.ctx.font = 'bold 20px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(\`GAME OVER\\n\${reason}\\nFinal Score: \${this.score}\`, this.canvas.width / 2, this.canvas.height / 2);
            }
        }

        new FastMathGame();
    </script>
</body>
</html>
